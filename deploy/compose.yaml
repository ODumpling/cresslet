# Production recipe: cresslet behind Caddy (TLS). See docs/self-hosting.md#production.
#   cp .env.example .env; cp caddy.env.example caddy.env   # domain; DNS token
#   docker compose up -d --build
name: cresslet
services:
  cresslet:
    build: ..
    restart: unless-stopped
    env_file:
      - path: cresslet.env # other CRESSLET_* settings (GitHub login, admin token, limits …)
        required: false
    environment:
      CRESSLET_DOMAIN: ${CRESSLET_DOMAIN:?set CRESSLET_DOMAIN in .env}
      CRESSLET_SCHEME: https
      CRESSLET_PUBLIC_PORT: 443
      # For the per-IP limits. Caddy sets it to the client's address, replacing any the client sent
      # (no trusted_proxies in caddy/options.caddy; adding them would let those proxies set it).
      CRESSLET_CLIENT_IP_HEADER: x-forwarded-for
    volumes:
      - cresslet_data:/data
    expose: ["8787"] # only Caddy reaches it

  caddy:
    build:
      context: caddy
      args:
        DNS_MODULE: ${CADDY_DNS_MODULE:-github.com/caddy-dns/cloudflare@v0.2.4}
    restart: unless-stopped
    depends_on:
      cresslet:
        condition: service_healthy
    env_file: caddy.env # DNS provider credentials (caddy.env.example)
    environment:
      CRESSLET_DOMAIN: ${CRESSLET_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/dns.caddy:/etc/caddy/dns.caddy:ro
      - ./caddy/options.caddy:/etc/caddy/options.caddy:ro
      - caddy_data:/data # certificates + ACME account: keep it, or you re-issue (and hit rate limits)
      - caddy_config:/config

volumes:
  cresslet_data:
  caddy_data:
  caddy_config:
