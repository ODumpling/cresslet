# Cresslet on Coolify (Docker Compose build pack, compose location /deploy/coolify/compose.yaml),
# hardened for a host shared with other apps. See docs/self-hosting.md#coolify.
#
# - The whole container runs under gVisor (`runtime: runsc`; the host needs `runsc install`), so code
#   that escapes workerd lands in gVisor's user-space kernel, not the host's.
# - Each app sandbox runs as its own uid (CRESSLET_SANDBOX_UID_BASE). That needs root in the
#   container; under gVisor that root is the sandbox's, not the host's.
# - Coolify gives a compose app its own network (Traefik joins it), so the container isn't on the
#   shared `coolify` network. deploy/coolify/firewall.sh keeps that network off the host and
#   private ranges.
# - CPU, memory and pids caps so app traffic can't starve the other apps on the host.
services:
  cresslet:
    build:
      # Coolify runs compose with --project-directory set to the repo root, so this is the repo root
      # (by hand: docker compose --project-directory . -f deploy/coolify/compose.yaml …).
      context: .
    runtime: runsc
    user: root
    restart: unless-stopped
    # On a user-defined network Docker points resolv.conf at its embedded DNS (127.0.0.11), which
    # gVisor's network stack can't reach (gvisor.dev/docs/user_guide/faq), so use public resolvers.
    entrypoint:
      - sh
      - -c
      - printf 'nameserver %s\n' ${CRESSLET_RESOLVERS:-1.1.1.1 9.9.9.9} > /etc/resolv.conf && exec node server/main.ts
    environment:
      CRESSLET_DOMAIN: ${CRESSLET_DOMAIN:?set CRESSLET_DOMAIN}
      CRESSLET_SCHEME: ${CRESSLET_SCHEME:-https}
      CRESSLET_PUBLIC_PORT: ${CRESSLET_PUBLIC_PORT:-443}
      # Safer default than the server's for a public host: no signup unless set.
      CRESSLET_OPEN_SIGNUP: ${CRESSLET_OPEN_SIGNUP:-false}
      CRESSLET_ADMIN_TOKEN: ${CRESSLET_ADMIN_TOKEN:-}
      CRESSLET_SITE_ADMINS: ${CRESSLET_SITE_ADMINS:-}
      # Cloudflare's proxy + the Traefik labels below route only <domain> and *.<domain>: other people's
      # hostnames get no route or certificate, so don't let apps add them (docs/self-hosting.md#coolify).
      CRESSLET_CUSTOM_DOMAINS: ${CRESSLET_CUSTOM_DOMAINS:-false}
      CRESSLET_GITHUB_CLIENT_ID: ${CRESSLET_GITHUB_CLIENT_ID:-}
      CRESSLET_GITHUB_CLIENT_SECRET: ${CRESSLET_GITHUB_CLIENT_SECRET:-}
      # Source control (docs/self-hosting.md#source-control): off while the GitHub App's client id/secret are empty.
      CRESSLET_GITHUB_APP_ID: ${CRESSLET_GITHUB_APP_ID:-}
      CRESSLET_GITHUB_APP_CLIENT_ID: ${CRESSLET_GITHUB_APP_CLIENT_ID:-}
      CRESSLET_GITHUB_APP_CLIENT_SECRET: ${CRESSLET_GITHUB_APP_CLIENT_SECRET:-}
      CRESSLET_GITHUB_APP_SLUG: ${CRESSLET_GITHUB_APP_SLUG:-}
      CRESSLET_GITHUB_WEBHOOK_SECRET: ${CRESSLET_GITHUB_WEBHOOK_SECRET:-}
      CRESSLET_GITHUB_SYNC_OAUTH_FALLBACK: ${CRESSLET_GITHUB_SYNC_OAUTH_FALLBACK:-false}
      # AI credits for the studio's AI builder (docs/api.md#ai-credits): off while the key is empty.
      CRESSLET_ANTHROPIC_API_KEY: ${CRESSLET_ANTHROPIC_API_KEY:-}
      CRESSLET_AI_MONTHLY_CREDITS: ${CRESSLET_AI_MONTHLY_CREDITS:-0}
      CRESSLET_AI_CREDITS_PER_USD: ${CRESSLET_AI_CREDITS_PER_USD:-100}
      CRESSLET_AI_MAX_CONCURRENT: ${CRESSLET_AI_MAX_CONCURRENT:-2}
      # Behind Cloudflare: cf-connecting-ip, so per-IP limits see clients, not Traefik.
      CRESSLET_CLIENT_IP_HEADER: ${CRESSLET_CLIENT_IP_HEADER:-}
      # Abuse limits sized for a small shared host (4 vCPU, 8 GB, ~70 GB disk; the server's own
      # defaults are larger). Worst cases: docs/self-hosting.md#sizing-a-shared-host.
      CRESSLET_APP_MEMORY_MB: ${CRESSLET_APP_MEMORY_MB:-128}
      # Sandboxes awake at once: 12 at a full 128 MB heap (plus workerd's own memory and a bindings
      # thread each) fit the 3 GB container with room for the control plane. Past it, the least
      # recently used idle one stops; all busy: 503.
      CRESSLET_MAX_RUNNING_SANDBOXES: ${CRESSLET_MAX_RUNNING_SANDBOXES:-12}
      # Open WebSockets (each pins its sandbox awake): per app / on the instance, and closed after
      # 10 min without traffic or 1 h in all (clients reconnect).
      CRESSLET_MAX_WEBSOCKETS_PER_APP: ${CRESSLET_MAX_WEBSOCKETS_PER_APP:-50}
      CRESSLET_MAX_WEBSOCKETS: ${CRESSLET_MAX_WEBSOCKETS:-500}
      CRESSLET_WS_IDLE_MS: ${CRESSLET_WS_IDLE_MS:-600000}
      CRESSLET_WS_MAX_MS: ${CRESSLET_WS_MAX_MS:-3600000}
      CRESSLET_APP_DB_MB: ${CRESSLET_APP_DB_MB:-128}
      CRESSLET_APP_FILES_MB: ${CRESSLET_APP_FILES_MB:-256}
      CRESSLET_MAX_APPS_PER_ACCOUNT: ${CRESSLET_MAX_APPS_PER_ACCOUNT:-10}
      CRESSLET_CREATES_PER_HOUR: ${CRESSLET_CREATES_PER_HOUR:-20}
      CRESSLET_DEPLOYS_PER_HOUR: ${CRESSLET_DEPLOYS_PER_HOUR:-120}
      CRESSLET_PAGE_VISIBILITY: ${CRESSLET_PAGE_VISIBILITY:-private}
      CRESSLET_PAGE_RETENTION_DAYS: ${CRESSLET_PAGE_RETENTION_DAYS:-30}
      CRESSLET_MAX_PAGES_PER_ACCOUNT: ${CRESSLET_MAX_PAGES_PER_ACCOUNT:-50}
      CRESSLET_SANDBOX_UID_BASE: 100000
      # `runtime: runsc` above: tells the server, so it doesn't warn about missing gVisor.
      CRESSLET_OUTER_GVISOR: "true"
      CRESSLET_SOCK_DIR: /run/cresslet
    tmpfs:
      - /run:size=64m,mode=755
    volumes:
      - data:/data
    mem_limit: ${CRESSLET_CONTAINER_MEMORY:-3g}
    cpus: ${CRESSLET_CONTAINER_CPUS:-2}
    pids_limit: 4096
    security_opt:
      - no-new-privileges:true
    labels:
      # The studio, every <app>.<domain> and the preview host. Coolify doesn't interpolate variables
      # in labels (it escapes `$`), so the domain is written out: change `cresslet.dev` (4 places).
      - traefik.enable=true
      - traefik.http.middlewares.cresslet-https-redirect.redirectscheme.scheme=https
      - traefik.http.routers.cresslet-http.entryPoints=http
      - traefik.http.routers.cresslet-http.middlewares=cresslet-https-redirect
      - traefik.http.routers.cresslet-http.rule=Host(`cresslet.dev`) || HostRegexp(`^[a-z0-9-]+\.cresslet\.dev$`)
      - traefik.http.routers.cresslet-http.service=cresslet
      - traefik.http.routers.cresslet-https.entryPoints=https
      - traefik.http.routers.cresslet-https.rule=Host(`cresslet.dev`) || HostRegexp(`^[a-z0-9-]+\.cresslet\.dev$`)
      - traefik.http.routers.cresslet-https.service=cresslet
      - traefik.http.routers.cresslet-https.tls=true
      - traefik.http.services.cresslet.loadbalancer.server.port=8787

volumes:
  # Coolify names it <app uuid>_data (a `name:` here is ignored). Moving from a Dockerfile deploy:
  # copy the old volume into it first (docs/self-hosting.md#coolify).
  data:
