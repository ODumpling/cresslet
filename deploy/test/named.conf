// Test-only authoritative DNS for deploy/test/acme.sh. The TSIG key below exists only for this
// throwaway network; it guards nothing.
options {
	directory "/var/cache/bind";
	recursion no;
	listen-on { any; };
	listen-on-v6 { none; };
	allow-query { any; };
	dnssec-validation no;
};

key "caddy" {
	algorithm hmac-sha256;
	secret "o3/lA6ITes+dU+yezlfMGzfrVggvIlfkRO0hHGWNSqw=";
};

zone "cresslet.test" {
	type primary;
	file "/var/cache/bind/cresslet.test.zone";
	update-policy { grant caddy zonesub TXT; };
};

zone "example.test" {
	type primary;
	file "/var/cache/bind/example.test.zone";
	update-policy { grant caddy zonesub TXT; };
};
